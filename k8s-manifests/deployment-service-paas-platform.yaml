# Deployment Service in paas-platform namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-service
  namespace: paas-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployment-service
  template:
    metadata:
      labels:
        app: deployment-service
    spec:
      serviceAccountName: deployment-service-account
      containers:
      - name: deployment-service
        image: paas-platform/deployment-service:latest
        ports:
        - containerPort: 8080
        env:
        - name: MONGODB_HOST
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: MONGODB_HOST
        - name: MONGODB_PORT
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: MONGODB_PORT
        - name: MONGODB_USER
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: MONGODB_USER
        - name: MONGODB_PWD
          valueFrom:
            secretKeyRef:
              name: deployment-service-secrets
              key: MONGODB_PWD
        - name: MONGODB_NAME
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: MONGODB_NAME
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: POSTGRES_PORT
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: POSTGRES_USER
        - name: POSTGRES_PWD
          valueFrom:
            secretKeyRef:
              name: deployment-service-secrets
              key: POSTGRES_PWD
        - name: POSTGRES_NAME
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: POSTGRES_NAME
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: REDIS_PORT
        - name: REDIS_PWD
          valueFrom:
            secretKeyRef:
              name: deployment-service-secrets
              key: REDIS_PWD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: deployment-service-secrets
              key: JWT_SECRET
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: deployment-service
  namespace: paas-platform
spec:
  selector:
    app: deployment-service
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
