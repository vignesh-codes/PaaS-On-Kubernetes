apiVersion: apps/v1
kind: Deployment
metadata:
  name: opamp-server
  namespace: otel-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opamp-server
  template:
    metadata:
      labels:
        app: opamp-server
    spec:
      containers:
        - name: opamp-server
          image: golang:1.23-alpine
          command: 
            - sh
            - -c
            - |
              apk add --no-cache git
              cd /tmp && \
              git clone https://github.com/open-telemetry/opamp-go.git && \
              cd opamp-go/examples/server && \
              go run . -l :4320
          ports:
            - containerPort: 4320
              name: opamp-ws
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: opamp-server
  namespace: otel-gateway
spec:
  selector:
    app: opamp-server
  ports:
    - port: 4320
      targetPort: 4320
      protocol: TCP
      name: opamp-ws

