# ServiceAccount for Deployment Service
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-service-sa
  namespace: core-services
---
# ClusterRole for Kubernetes API access
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployment-service-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "persistentvolumeclaims", "events", "configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["extensions", "networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployment-service-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deployment-service-role
subjects:
- kind: ServiceAccount
  name: deployment-service-sa
  namespace: core-services
---
# Deployment Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-service
  namespace: core-services
  labels:
    app: deployment-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: deployment-service
  template:
    metadata:
      labels:
        app: deployment-service
    spec:
      serviceAccountName: deployment-service-sa
      containers:
      - name: deployment-service
        image: paas-platform/deployment-service:latest
        ports:
        - containerPort: 8080
        env:
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: ENVIRONMENT
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: PORT
        - name: REGION
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: REGION
        - name: REDIS_SERVER
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: REDIS_SERVER
        - name: POSTGRESDB_HOST
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: POSTGRESDB_HOST
        - name: POSTGRESDB_DB
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: POSTGRESDB_DB
        - name: POSTGRESDB_PORT
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: POSTGRESDB_PORT
        - name: POSTGRESDB_USER
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: POSTGRESDB_USER
        - name: POSTGRESDB_PWD
          valueFrom:
            secretKeyRef:
              name: deployment-service-secrets
              key: POSTGRESDB_PWD
        - name: MONGODB_USER
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: MONGODB_USER
        - name: MONGODB_PWD
          valueFrom:
            secretKeyRef:
              name: deployment-service-secrets
              key: MONGODB_PWD
        - name: MONGODB_NAME
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: MONGODB_NAME
        - name: MONGODB_HOST
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: MONGODB_HOST
        - name: MONGODB_PORT
          valueFrom:
            configMapKeyRef:
              name: deployment-service-config
              key: MONGODB_PORT
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: deployment-service-secrets
              key: JWT_SECRET
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
# Deployment Service Service
apiVersion: v1
kind: Service
metadata:
  name: deployment-service
  namespace: core-services
  labels:
    app: deployment-service
spec:
  selector:
    app: deployment-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
