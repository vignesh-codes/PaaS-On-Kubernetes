apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-agent-opentelemetry-collector
  namespace: otelagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-agent-kubeletstats-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/stats"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-agent-kubeletstats-binding
subjects:
  - kind: ServiceAccount
    name: otel-agent-opentelemetry-collector
    namespace: otelagent
roleRef:
  kind: ClusterRole
  name: otel-agent-kubeletstats-role
  apiGroup: rbac.authorization.k8s.io
