# MongoDB Database Deployment
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init-script
  namespace: core-services
data:
  init-user.js: |
    db = db.getSiblingDB('admin');
    db.createUser({
      user: 'admin',
      pwd: 'admin_password',
      roles: [{ role: 'root', db: 'admin' }]
    });
    db = db.getSiblingDB('paas_db');
    db.createUser({
      user: 'paas_user',
      pwd: 'paas_password',
      roles: [{ role: 'readWrite', db: 'paas_db' }]
    });
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  namespace: core-services
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:7
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "admin"
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: "admin_password"
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: mongo-data
        emptyDir: {}
      - name: init-script
        configMap:
          name: mongodb-init-script
---
# MongoDB Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: core-services
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# MongoDB Configuration ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  namespace: core-services
data:
  mongod.conf: |
    storage:
      dbPath: /data/db
    systemLog:
      destination: file
      logAppend: true
      path: /var/log/mongodb/mongod.log
    net:
      port: 27017
      bindIp: 0.0.0.0
    security:
      authorization: enabled
---
# MongoDB Secrets
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secrets
  namespace: core-services
type: Opaque
stringData:
  MONGO_ROOT_PASSWORD: "admin_password"
  MONGO_USER: "paas_user"
  MONGO_PASSWORD: "paas_password"
  MONGO_DATABASE: "paas_db"
---
# MongoDB Service
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: core-services
spec:
  selector:
    app: mongodb
  ports:
  - port: 27017
    targetPort: 27017
    protocol: TCP
    name: mongodb
---
# MongoDB User Initialization Job
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init
  namespace: core-services
spec:
  template:
    spec:
      containers:
      - name: mongodb-init
        image: mongo:7.0
        command:
        - /bin/bash
        - -c
        - |
          mongosh --host mongodb-service:27017 -u admin -p admin_password --authenticationDatabase admin --eval "
            db = db.getSiblingDB('paas_db');
            db.createUser({
              user: 'paas_user',
              pwd: 'paas_password',
              roles: [
                { role: 'readWrite', db: 'paas_db' }
              ]
            });
            print('User created successfully');
          "
        env:
        - name: MONGO_INITDB_DATABASE
          value: "paas_db"
      restartPolicy: OnFailure
  backoffLimit: 3
