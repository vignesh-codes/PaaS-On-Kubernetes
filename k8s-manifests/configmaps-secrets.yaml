# ConfigMaps for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: paas-platform
data:
  NODE_ENV: "production"
  PORT: "5000"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: deployment-service-config
  namespace: core-services
data:
  ENVIRONMENT: "dev"
  PORT: ":8080"
  REGION: "us-west-2"
  REDIS_SERVER: "redis-service:6379"
  POSTGRESDB_HOST: "postgres-service"
  POSTGRESDB_DB: "paas_db"
  POSTGRESDB_PORT: "5432"
  POSTGRESDB_USER: "paas_user"
  MONGODB_USER: "paas_user"
  MONGODB_NAME: "paas_db"
  MONGODB_HOST: "mongodb-service"
  MONGODB_PORT: "27017"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-service-config
  namespace: paas-platform
data:
  NODE_ENV: "production"
  VITE_API_URL: "http://localhost/api/deployments"
  VITE_AUTH_URL: "http://localhost/api/auth"
---
# Secrets for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: paas-platform
type: Opaque
stringData:
  JWT_SECRET: "jlasfndafgnogbnsrijgbrgujobn"
  MONGOURL: "mongodb://paas_user:paas_password@mongodb-service.core-services.svc.cluster.local:27017/paas_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: deployment-service-secrets
  namespace: core-services
type: Opaque
stringData:
  JWT_SECRET: "jlasfndafgnogbnsrijgbrgujobn"
  POSTGRESDB_PWD: "paas_password"
  MONGODB_PWD: "paas_password"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: core-services
type: Opaque
stringData:
  POSTGRES_USER: "paas_user"
  POSTGRES_PASSWORD: "paas_password"
  POSTGRES_DB: "paas_db"
