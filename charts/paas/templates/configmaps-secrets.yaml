apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: {{ .Values.namespaces.paas }}
data:
  NODE_ENV: "production"
  PORT: "5000"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: deployment-service-config
  namespace: {{ .Values.namespaces.core }}
data:
  ENVIRONMENT: "dev"
  PORT: ":8080"
  REGION: "us-west-2"
  POSTGRESDB_HOST: "postgres-service"
  POSTGRESDB_DB: "paas_db"
  POSTGRESDB_PORT: "5432"
  POSTGRESDB_USER: "paas_user"
  MONGODB_USER: "paas_user"
  MONGODB_NAME: "paas_db"
  MONGODB_HOST: "mongodb"
  MONGODB_PORT: "27017"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-service-config
  namespace: {{ .Values.namespaces.paas }}
data:
  NODE_ENV: "production"
  VITE_API_URL: "http://localhost/api/deployments"
  VITE_AUTH_URL: "http://localhost/api/auth"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: {{ .Values.namespaces.paas }}
type: Opaque
stringData:
  JWT_SECRET: "jlasfndafgnogbnsrijgbrgujobn"
  MONGOURL: "mongodb://paas_user:paas_password@mongodb.{{ .Values.namespaces.core }}.svc.cluster.local:27017/paas_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: deployment-service-secrets
  namespace: {{ .Values.namespaces.core }}
type: Opaque
stringData:
  JWT_SECRET: "jlasfndafgnogbnsrijgbrgujobn"
  POSTGRESDB_PWD: "paas_password"
  MONGODB_PWD: "paas_password"

