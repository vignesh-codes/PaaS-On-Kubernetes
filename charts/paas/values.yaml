global:
  imagePullPolicy: IfNotPresent

namespaces:
  create: true
  paas: paas-platform
  core: core-services
  otelGateway: otel-gateway

authService:
  image: paas-platform/auth-service:latest
  replicas: 1

deploymentService:
  image: paas-platform/deployment-service:latest
  replicas: 1

frontendService:
  image: paas-platform/frontend-service:latest
  replicas: 1

otlpToPostgres:
  enabled: true
  image: python:3.12-slim
  postgres:
    host: postgres-service.core-services.svc.cluster.local
    port: 5432
    db: paas_db
    user: paas_user
    password: paas_password

